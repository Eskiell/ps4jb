<!doctype html>
<html lang="pt-BR" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BEHELIT</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; background: #080a08; color: #c6cec6; font: 16px/1.6 "Courier New", monospace; }
main { max-width: 1000px; margin: 32px auto; padding: 0 24px; }
h1 { font-size: 22px; font-weight: normal; margin: 0 0 20px; }
#det, #cache { color: #939e93; }
button { margin: 24px 0; padding: 10px 24px; border: 1px solid #a6b6a6; border-radius: 0; background: #080a08; color: #d9e4d9; font: inherit; cursor: pointer; }
button:focus, button:hover { outline: 2px solid #c6cec6; outline-offset: 3px; }
button:disabled { color: #7e887e; border-color: #454e45; cursor: default; outline: none; }
#state { margin-bottom: 12px; }
#out { height: 52vh; min-height: 200px; overflow-y: auto; border-top: 1px solid #454e45; padding: 16px 0; white-space: pre-wrap; overflow-wrap: break-word; font: inherit; margin: 0; }
.ok { color: #9dce9d; } .warn { color: #d4c58d; } .bad { color: #df9898; }
@media (max-width: 600px) { main { margin: 20px auto; padding: 0 16px; } }
</style>
</head>
<body>
<main>
<h1>BEHELIT</h1>
<div id="det">Firmware: identificando...</div>
<div id="cache">Cache: verificando...</div>
<button id="start" type="button">JAILBREAK</button>
<div id="state" role="status">Estado: aguardando início</div>
<pre id="out" role="log" aria-label="Log de execução">&gt; Aguardando comando.</pre>
</main>
<script>
(function () {
    var button = document.getElementById("start");
    var state = document.getElementById("state");
    var out = document.getElementById("out");
    var cache = document.getElementById("cache");
    var started = false;
    var updateReady = false;
    var resumeKey = "raw-jb-resume";
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    document.getElementById("det").textContent = "Firmware: " + (m ? m[1] + "." + m[2] : "não identificado");
    function note(text) {
        out.textContent += "\n> " + text;
        out.scrollTop = out.scrollHeight;
    }
    function start() {
        if (started) return;
        if (updateReady) {
            location.reload();
            return;
        }
        started = true;
        button.disabled = true;
        button.textContent = "EM EXECUÇÃO";
        state.textContent = "Estado: carregando...";
        note("Iniciando processo...");
        var script = document.createElement("script");
        script.type = "module";
        script.src = "./jb.js?v=10";
        script.onerror = function () {
            state.textContent = "Estado: falha ao carregar. Recarregue a página para tentar novamente.";
            state.className = "bad";
            button.textContent = "FALHA";
            note("Não foi possível carregar os arquivos do processo.");
        };
        document.body.appendChild(script);
    }
    button.addEventListener("click", start);
    function setCache(text) { cache.textContent = "Cache: " + text; }
    function onUpdate() {
        setCache("atualização disponível; recarregue antes da próxima execução");
        if (!started) {
            updateReady = true;
            button.textContent = "ATUALIZAR PÁGINA";
        }
    }
    var ac = window.applicationCache;
    if (!ac) setCache("indisponível neste navegador");
    else {
        if (!navigator.onLine) setCache("offline");
        else if (ac.status === ac.IDLE) setCache("pronto para uso offline");
        else if (ac.status === ac.UPDATEREADY) onUpdate();
        ac.addEventListener("checking", function () { setCache("verificando..."); });
        ac.addEventListener("downloading", function () { setCache("baixando para uso offline..."); });
        ac.addEventListener("progress", function (e) {
            if (e.total) setCache("baixando " + Math.round(e.loaded / e.total * 100) + "%");
        });
        ac.addEventListener("cached", function () { setCache("pronto para uso offline"); });
        ac.addEventListener("noupdate", function () { setCache("pronto para uso offline"); });
        ac.addEventListener("updateready", onUpdate);
        ac.addEventListener("error", function () { setCache("indisponível; execução online ainda pode ser possível"); });
        ac.addEventListener("obsolete", function () { setCache("obsoleto; recarregue quando estiver online"); });
    }
    var resume = false;
    try {
        resume = sessionStorage.getItem(resumeKey) === location.pathname + location.search;
        sessionStorage.removeItem(resumeKey);
    } catch (e) {}
    if (resume) {
        updateReady = false;
        note("Retomando tentativa automática...");
        start();
    }
})();
</script>
</body>
</html>
